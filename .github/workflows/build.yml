name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        shell: powershell
        run: .\build.ps1 -Sign

      - name: Test
        shell: powershell
        run: python tests\run_tests.py

      - uses: actions/upload-artifact@v4
        with:
          name: JiYuTrainer-JareLi
          path: |
            dist/**
            JiYuTrainer-JareLi-1.7.7.zip
