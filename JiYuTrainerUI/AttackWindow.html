<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>UDP 重放攻击</title>
    <style>
        html, body { margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f6f8fb;
            color: #1f2937;
            font-size: 12px;
            overflow: hidden;
        }
        * { box-sizing: border-box; }

        .page {
            height: 100%;
            padding: 16px 18px 12px 18px;
            overflow-y: scroll;
        }
        .header { position: relative; padding-right: 120px; }
        .header h1 {
            margin: 0;
            font-size: 18px;
            line-height: 26px;
            font-weight: 700;
            color: #0f172a;
        }
        .header p {
            margin: 2px 0 0 0;
            font-size: 10px;
            color: #64748b;
        }
        .badge {
            position: absolute;
            right: 0;
            top: 2px;
            padding: 3px 8px;
            border-radius: 7px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 10px;
            border: 1px solid #fed7aa;
        }
        .notice {
            margin-top: 10px;
            padding: 9px 11px;
            border-radius: 9px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            font-size: 10px;
            line-height: 15px;
        }
        .notice b { color: #c2410c; }

        .card {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        .card-title {
            margin: 0 0 8px 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .3px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .row { position: relative; margin-bottom: 8px; }
        .row:last-child { margin-bottom: 0; }
        .row label {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            color: #475569;
        }
        .inline { position: relative; }
        .inline .grow { display: block; padding-right: 96px; }
        .inline.small .grow { padding-right: 64px; }
        .inline .btn { position: absolute; right: 0; top: 0; }
        .port-row input { display: inline-block; width: 120px; }
        .port-row .btn { margin-left: 8px; }
        textarea, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            background: #fbfdff;
            color: #0f172a;
            font-size: 11px;
            font-family: Consolas, "Microsoft YaHei UI", monospace;
            outline: none;
            resize: none;
        }
        textarea:focus, input:focus { border-color: #2ea4f0; background: #ffffff; }
        #input_target_ip { height: 38px; }
        #input_send_message { height: 30px; }
        #input_send_cmd { height: 38px; }
        #input_target_port { width: 120px; height: 30px; }
        .btn {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 8px;
            background: #eef2f7;
            color: #334155;
            font-size: 11px;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #e2e8f0; }
        .btn-primary { background: #2ea4f0; color: #ffffff; }
        .btn-primary:hover { background: #1d8ed8; }
        .btn-warn { background: #fff1e6; color: #c2410c; }
        .btn-warn:hover { background: #ffe4cc; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 7px 10px; }
        .actions { margin-top: 2px; }
        .actions .btn { margin-right: 6px; }

        #result_list {
            height: 76px;
            padding: 8px 9px;
            border-radius: 9px;
            background: #0f172a;
            color: #cbd5e1;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10px;
            line-height: 15px;
            overflow-y: scroll;
        }
        #result_list div { margin-bottom: 2px; }
        .footer {
            margin-top: 9px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
            text-align: center;
        }
        .footer a { color: #0369a1; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <h1>UDP 重放攻击</h1>
        <p>极域电子教室数据包（UDP）重放 · 原 1.7.6 协议实现</p>
        <div class="badge">原样保留</div>
    </div>

    <div class="notice">
        <b>仅限授权测试。</b>该模块会向目标主机的极域端口发送原始数据包，可执行命令、关机或重启。请只对你拥有或已获书面授权的设备使用。
    </div>

    <div class="card">
        <div class="card-title">目标</div>
        <div class="row">
            <label>目标主机 IP（多个用英文逗号分隔）</label>
            <div class="inline">
                <div class="grow"><textarea id="input_target_ip" placeholder="例如：192.168.1.10, 192.168.1.11"></textarea></div>
                <a href="#" class="btn btn-sm" id="btn_scan_ip">扫描局域网</a>
            </div>
        </div>
        <div class="row">
            <label>极域监听端口</label>
            <div class="port-row">
                <input id="input_target_port" type="number" min="1" max="65535" value="4705" />
                <a href="#" class="btn btn-sm" id="btn_scan_port">检测本机端口</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">发送内容</div>
        <div class="row">
            <label>文字消息（100 字符以内）</label>
            <div class="inline small">
                <div class="grow"><textarea id="input_send_message" placeholder="要显示在目标屏幕上的文字"></textarea></div>
                <a href="#" class="btn btn-primary btn-sm" id="btn_send_msg">发送</a>
            </div>
        </div>
        <div class="row">
            <label>CMD 命令（原协议，最大 462 字符）</label>
            <div class="inline">
                <div class="grow"><textarea id="input_send_cmd" placeholder="例如：C:\Windows\System32\notepad.exe"></textarea></div>
                <a href="#" class="btn btn-primary btn-sm" id="btn_send_cmd">执行</a>
            </div>
        </div>
        <div class="row actions">
            <a href="#" class="btn btn-warn btn-sm" id="btn_send_shutdown">远程关机</a>
            <a href="#" class="btn btn-warn btn-sm" id="btn_send_reboot">远程重启</a>
        </div>
    </div>

    <div class="card">
        <div class="card-title">发送结果</div>
        <div id="result_list"><div>就绪。点击上方按钮发送指令。</div></div>
    </div>

    <div class="footer">
        原理由 <a href="https://github.com/ht0Ruial/Jiyu_udp_attack" target="_blank">ht0Ruial</a> 提供 ·
        本项目仅做 UI 重构，未修改协议字节 ·
        <a href="https://github.com/imengyu/JiYuTrainer" target="_blank">上游项目</a>
    </div>
</div>
<script type="text/tiscript">
    function self.ready()
    {
        view.docunmentComplete();
    }
</script>
</body>
</html>
