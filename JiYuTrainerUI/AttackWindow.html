<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>UDP 重放</title>
    <style>
        html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f4f7fb;
            color: #172033;
            font-size: 12px;
            padding: 18px;
            box-sizing: border-box;
            height: 100%;
            overflow-y: auto;
        }
        * { box-sizing: border-box; }

        .header { height: 52px; }
        .header h1 {
            margin: 0;
            font-size: 22px;
            line-height: 28px;
            font-weight: 700;
            color: #0f172a;
        }
        .header p {
            margin: 3px 0 0 0;
            font-size: 10px;
            line-height: 15px;
            color: #64748b;
        }
        .badge {
            float: right;
            margin-top: 3px;
            padding: 5px 10px;
            border-radius: 8px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            font-size: 10px;
        }

        .notice {
            margin: 8px 0 12px 0;
            padding: 9px 12px;
            border-radius: 9px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            font-size: 10px;
            line-height: 15px;
        }
        .notice b { color: #c2410c; }

        .layout {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .layout td {
            vertical-align: top;
            padding: 0;
        }
        .pane-left { width: 38%; padding-right: 12px !important; }
        .pane-right { width: 58%; padding-left: 12px !important; }

        .card {
            padding: 14px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .035);
        }
        .card + .card { margin-top: 12px; }
        .card-title {
            margin: 0 0 10px 0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .4px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        label {
            display: block;
            margin: 0 0 5px 0;
            font-size: 11px;
            color: #475569;
        }
        input[type="text"], input[type="number"], textarea {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            background: #fbfdff;
            color: #0f172a;
            font-size: 11px;
            font-family: Consolas, "Microsoft YaHei UI", monospace;
            outline: none;
            resize: none;
        }
        input[type="text"] { height: 34px; }
        input[type="number"] { height: 32px; }
        input:focus, textarea:focus {
            border-color: #2ea4f0;
            background: #ffffff;
        }
        #input_send_message { height: 64px; }
        #input_send_cmd { height: 104px; }

        .field { margin-bottom: 10px; }
        .field:last-child { margin-bottom: 0; }

        .btn {
            display: block;
            width: 100%;
            height: 38px;
            line-height: 38px;
            padding: 0 12px;
            border: none;
            border-radius: 9px;
            background: #eef2f7;
            color: #334155;
            font-family: inherit;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
        .btn:hover { background: #e2e8f0; }
        .btn-primary { background: #2ea4f0; color: #ffffff; }
        .btn-primary:hover { background: #1d8ed8; }
        .btn-warn { background: #fff1e6; color: #c2410c; }
        .btn-warn:hover { background: #ffe4cc; }
        .btn + .btn { margin-top: 8px; }

        #result_list {
            height: 222px;
            padding: 9px 10px;
            border-radius: 9px;
            background: #0f172a;
            color: #cbd5e1;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10px;
            line-height: 15px;
            overflow-y: scroll;
        }
        #result_list div { margin-bottom: 2px; }

        .hint {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
        }
        .tips p {
            margin: 0 0 6px 0;
            color: #64748b;
            font-size: 10px;
            line-height: 15px;
        }
        .tips p:last-child { margin-bottom: 0; }

        .footer {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
            text-align: center;
        }
        .footer a { color: #0369a1; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <span class="badge">原协议兼容</span>
        <h1>UDP 重放</h1>
        <p>极域电子教室数据包重放 · 保留 1.7.6 协议字节</p>
    </div>

    <div class="notice">
        <b>仅限授权测试。</b>会向目标主机极域端口发送原始数据包，可执行命令、关机或重启。请只对自己拥有或已书面授权的设备使用。
    </div>

    <table class="layout">
        <tr>
            <td class="pane-left">
                <div class="card">
                    <div class="card-title">目标</div>
                    <div class="field">
                        <label>目标主机 IP（多个用英文逗号分隔）</label>
                        <input id="input_target_ip" type="text" placeholder="例如：192.168.1.10, 192.168.1.11" />
                    </div>
                    <div class="field">
                        <button type="button" class="btn" id="btn_scan_ip">扫描局域网主机</button>
                    </div>
                    <div class="field">
                        <label>极域监听端口</label>
                        <input id="input_target_port" type="number" min="1" max="65535" value="4705" />
                    </div>
                    <div class="field">
                        <button type="button" class="btn" id="btn_scan_port">检测本机端口</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">发送结果</div>
                    <div id="result_list"><div>就绪。选择右侧操作发送指令。</div></div>
                </div>
            </td>

            <td class="pane-right">
                <div class="card">
                    <div class="card-title">文字消息</div>
                    <div class="field">
                        <label>显示在目标屏幕上的文字（100 字符以内）</label>
                        <textarea id="input_send_message" placeholder="输入要显示的文字"></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn_send_msg">发送文字消息</button>
                </div>

                <div class="card">
                    <div class="card-title">CMD 命令</div>
                    <div class="field">
                        <label>原协议命令（最大 462 字符）</label>
                        <textarea id="input_send_cmd" placeholder="例如：C:\Windows\System32\notepad.exe"></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn_send_cmd">执行 CMD 命令</button>
                    <div class="hint">发送成功只代表 UDP 数据包已发出，不代表目标一定执行。</div>
                </div>

                <div class="card">
                    <div class="card-title">远程操作</div>
                    <button type="button" class="btn btn-warn" id="btn_send_shutdown">远程关机</button>
                    <button type="button" class="btn btn-warn" id="btn_send_reboot">远程重启</button>
                </div>

            </td>
        </tr>
    </table>

    <div class="footer">
        原理由 <a href="https://github.com/ht0Ruial/Jiyu_udp_attack" target="_blank">ht0Ruial</a> 提供 ·
        扫描仅限同网段 · 本项目仅做 UI 重构，未修改协议字节 ·
        <a href="https://github.com/imengyu/JiYuTrainer" target="_blank">上游项目</a>
    </div>

    <script type="text/tiscript">
        function self.ready()
        {
            view.docunmentComplete();
        }
    </script>
</body>
</html>
