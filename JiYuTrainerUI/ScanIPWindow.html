<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>局域网扫描</title>
    <style>
        html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f4f7fb;
            color: #172033;
            font-size: 12px;
            padding: 18px;
            box-sizing: border-box;
            height: 100%;
            overflow-y: auto;
        }
        * { box-sizing: border-box; }

        .header { height: 54px; }
        .header h1 {
            margin: 0;
            font-size: 21px;
            line-height: 27px;
            font-weight: 700;
            color: #0f172a;
        }
        .header p {
            margin: 3px 0 0 0;
            font-size: 10px;
            line-height: 15px;
            color: #64748b;
        }

        .card {
            padding: 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .035);
        }
        .field { margin-bottom: 12px; }
        .field:last-child { margin-bottom: 0; }
        label {
            display: block;
            margin: 0 0 5px 0;
            font-size: 11px;
            color: #475569;
        }
        select, input {
            display: block;
            width: 100%;
            height: 34px;
            padding: 0 10px;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            background: #fbfdff;
            color: #0f172a;
            font-size: 12px;
            font-family: Consolas, "Microsoft YaHei UI", monospace;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #2ea4f0;
            background: #ffffff;
        }

        .btn {
            display: block;
            width: 100%;
            height: 40px;
            line-height: 40px;
            padding: 0 12px;
            border: none;
            border-radius: 9px;
            background: #2ea4f0;
            color: #ffffff;
            font-family: inherit;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
        .btn:hover { background: #1d8ed8; }
        .btn[disabled] { background: #cbd5e1; }

        .hint {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
        }

        .result-head {
            margin: 14px 1px 7px 1px;
            height: 18px;
        }
        .result-head b {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .4px;
            color: #94a3b8;
            line-height: 18px;
        }
        #scan_status {
            float: right;
            color: #64748b;
            font-size: 9px;
            line-height: 18px;
        }

        #ip_list {
            height: 258px;
            padding: 4px 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow-y: scroll;
            font-size: 11px;
            color: #334155;
        }
        #ip_list > div {
            padding: 8px 11px;
            border-bottom: 1px solid #f1f5f9;
            line-height: 16px;
        }
        #ip_list > div:last-child { border-bottom: none; }
        #ip_list a {
            display: inline-block;
            color: #0369a1;
            text-decoration: none;
            font-family: Consolas, monospace;
            font-size: 11px;
        }
        #ip_list a:hover { text-decoration: underline; }
        #ip_list span {
            display: inline-block;
            margin-left: 8px;
            color: #94a3b8;
            font-size: 9px;
            font-family: Consolas, monospace;
        }
        .empty { color: #94a3b8; font-size: 10px; padding: 8px 10px; }

        .footer {
            margin-top: 9px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>局域网扫描</h1>
        <p>选择本机网卡，填写同一网段的起止地址；使用 ARP 扫描，不修改目标主机。</p>
    </div>

    <div class="card">
        <div class="field">
            <label>本机地址</label>
            <select id="select_address"></select>
        </div>
        <div class="field">
            <label>开始地址</label>
            <input id="input_start_add" placeholder="192.168.1.1" />
        </div>
        <div class="field">
            <label>结束地址</label>
            <input id="input_end_add" placeholder="192.168.1.254" />
        </div>
        <button type="button" class="btn" id="btn_refresh_ip_list">开始扫描主机 IP</button>
        <div class="hint">只扫描同一网段；点击结果中的 IP 可复制。</div>
    </div>

    <div class="result-head">
        <b>扫描结果</b>
        <span id="scan_status">就绪</span>
    </div>
    <div id="ip_list">
        <div class="empty">尚未开始扫描</div>
    </div>

    <div class="footer">扫描结果来自局域网 ARP 响应，未响应不代表主机不存在。</div>

    <script type="text/tiscript">
        function self.ready()
        {
            view.docunmentComplete();
        }
    </script>
</body>
</html>
