<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>扫描局域网主机</title>
    <style>
        html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f6f8fb;
            color: #1f2937;
            font-size: 12px;
            padding: 16px;
            box-sizing: border-box;
            height: auto;
            min-height: 100%;
            overflow-y: auto;
        }
        * { box-sizing: border-box; }
        .header { height: 48px; }
        .header h1 {
            margin: 0;
            font-size: 18px;
            line-height: 24px;
            font-weight: 700;
            color: #0f172a;
        }
        .header p {
            margin: 1px 0 0 0;
            font-size: 10px;
            line-height: 15px;
            color: #64748b;
        }
        .card {
            margin-top: 10px;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
        .field { margin-bottom: 8px; }
        .field:last-child { margin-bottom: 0; }
        .field label {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            color: #475569;
        }
        select, input {
            width: 100%;
            height: 32px;
            padding: 0 9px;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            background: #fbfdff;
            color: #0f172a;
            font-size: 12px;
            font-family: Consolas, "Microsoft YaHei UI", monospace;
            outline: none;
        }
        select:focus, input:focus { border-color: #2ea4f0; background: #ffffff; }
        .range-row { position: relative; }
        .range-row .field { display: inline-block; width: 49%; vertical-align: top; }
        .range-row .field + .field { margin-left: 2%; }
        .btn {
            display: inline-block;
            width: 100%;
            height: 38px;
            line-height: 38px;
            margin-top: 2px;
            border-radius: 9px;
            background: #2ea4f0;
            color: #ffffff;
            font-size: 12px;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #1d8ed8; }
        .btn[disabled] { background: #cbd5e1; color: #ffffff; }
        .hint {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 9px;
            line-height: 14px;
        }
        .list-title {
            margin: 10px 0 5px 2px;
            font-size: 10px;
            letter-spacing: .3px;
            color: #94a3b8;
            font-weight: 600;
        }
        #ip_list {
            height: 250px;
            padding: 4px 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow-y: scroll;
            font-size: 11px;
            color: #334155;
        }
        #ip_list > div {
            padding: 7px 10px;
            border-bottom: 1px solid #f1f5f9;
            line-height: 16px;
        }
        #ip_list > div:last-child { border-bottom: none; }
        #ip_list a {
            display: inline-block;
            color: #0369a1;
            text-decoration: none;
            font-family: Consolas, monospace;
            font-size: 11px;
        }
        #ip_list a:hover { text-decoration: underline; }
        #ip_list span {
            display: inline-block;
            margin-left: 8px;
            color: #94a3b8;
            font-size: 9px;
            font-family: Consolas, monospace;
        }
        .empty { color: #94a3b8; font-size: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>局域网主机扫描</h1>
        <p>选择本机网卡，填写同一网段的起止地址；扫描结果可点击复制 IP。</p>
    </div>

    <div class="card">
        <div class="field">
            <label>本机地址</label>
            <select id="select_address"></select>
        </div>
        <div class="range-row">
            <div class="field">
                <label>开始地址</label>
                <input id="input_start_add" placeholder="192.168.1.1" />
            </div>
            <div class="field">
                <label>结束地址</label>
                <input id="input_end_add" placeholder="192.168.1.254" />
            </div>
        </div>
        <a href="#" class="btn" id="btn_refresh_ip_list">开始扫描主机 IP</a>
        <div class="hint">只扫描同一网段；扫描使用 ARP，不会修改目标主机。点击结果中的 IP 可复制。</div>
    </div>

    <div class="list-title">扫描结果</div>
    <div id="ip_list">
        <div class="empty">请点击上方按钮开始扫描局域网内主机 IP</div>
    </div>

    <script type="text/tiscript">
        function self.ready()
        {
            view.docunmentComplete();
        }
    </script>
</body>
</html>
